name: Keyword ranking collect

on:
  schedule:
    # 04:00 KST is 19:00 UTC on the previous calendar day.
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ranking collector
        env:
          RANKING_COLLECT_SECRET: ${{ secrets.RANKING_COLLECT_SECRET }}
        run: |
          curl --fail --show-error --silent --max-time 540 \
            --request POST \
            --header "Authorization: Bearer ${RANKING_COLLECT_SECRET}" \
            https://fastincome.kr/api/ranking/collect
